name: Setup Nix
description: Set up Nix environment with Cachix for GitHub Actions
inputs:
  cachix-auth-token:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        # Do NOT set accept-flake-config = true here. CI runs on pull_request and
        # checks out the PR's flake; accept-flake-config would silently trust any
        # extra-substituters / trusted-public-keys a fork PR adds to flake.nix's
        # nixConfig, letting it serve attacker-built store paths that execute as
        # build code on the runner. Instead pin the trusted substituters here (a
        # trusted input) and leave accept-flake-config at its safe default (off).
        extra_nix_config: |
          substituters = https://cache.nixos.org https://takeokunn-darwin-vz-nix.cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= takeokunn-darwin-vz-nix.cachix.org-1:/JRjcn9UMUbE0DRyJUg7g+gq/e7QSUXxvz+FZprHIH4=
    # skipPush on both cachix-action steps: cachix-action otherwise auto-pushes
    # every store path built during the job in its post-step whenever an authToken
    # is present. Same-repo (non-fork) PRs DO receive secrets, so that would
    # publish derivations built from unreviewed PR code into the production cache.
    # Publishing happens only via the explicit, branch/tag-gated `cachix push` steps.
    - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      if: inputs.cachix-auth-token == ''
      with:
        name: takeokunn-darwin-vz-nix
        skipPush: true
    - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      if: inputs.cachix-auth-token != ''
      with:
        name: takeokunn-darwin-vz-nix
        authToken: "${{ inputs.cachix-auth-token }}"
        skipPush: true
