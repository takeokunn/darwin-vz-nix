name: Feature request
description: Propose an enhancement or new capability for darwin-vz-nix
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's getting in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you'd like. Include example CLI invocations or nix-darwin configuration if relevant.
      placeholder: |
        nix run github:takeokunn/darwin-vz-nix -- start --new-flag ...
        services.darwin-vz.newOption = ...;
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — use cases, related projects, links.
    validations:
      required: false
