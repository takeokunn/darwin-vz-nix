name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CACHIX_AUTH_TOKEN_PRESENT: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-test:
    name: macOS Checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Nix Flake Check (Darwin)
        run: nix flake check --print-build-logs --system aarch64-darwin

      - name: Swift unit tests (dev shell)
        run: nix develop --command swift-test-fast

      - name: Push darwin binary to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CACHIX_AUTH_TOKEN_PRESENT == 'true'
        run: |
          nix build .#darwin-vz-nix -o result-darwin
          cachix push takeokunn-darwin-vz-nix result-darwin

  guest-artifacts:
    name: Linux Guest Artifacts
    needs: darwin-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Nix flake check
        run: nix flake check --print-build-logs --system aarch64-linux

      - name: Build guest artifacts
        run: nix run .#build-guest-artifacts -- --out-dir ci-artifacts/runtime

      - name: Export guest artifact closure
        run: |
          nix-store -qR ci-artifacts/runtime/result-guest-artifacts > ci-artifacts/guest-artifacts.closure
          test -s ci-artifacts/guest-artifacts.closure
          mapfile -t guest_closure < ci-artifacts/guest-artifacts.closure
          nix-store --export "${guest_closure[@]}" \
            | nix shell .#zstd -c zstd -T0 -6 -o ci-artifacts/guest-artifacts.nar.zst
          test -s ci-artifacts/guest-artifacts.nar.zst

      - name: Upload guest artifact closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-artifact-closure
          path: |
            ci-artifacts/guest-artifacts.closure
            ci-artifacts/guest-artifacts.nar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Push guest artifacts to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CACHIX_AUTH_TOKEN_PRESENT == 'true'
        run: |
          cachix push takeokunn-darwin-vz-nix \
            ci-artifacts/runtime/result-kernel \
            ci-artifacts/runtime/result-initrd \
            ci-artifacts/runtime/result-system \
            ci-artifacts/runtime/result-guest-artifacts

  vm-smoke-notice:
    name: VM Smoke Test Notice
    needs: guest-artifacts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Explain VM smoke test runner requirement
        run: |
          cat <<'EOF'
          End-to-end VM smoke tests require Virtualization.framework on a physical
          Apple Silicon macOS host. GitHub-hosted macOS runners do not support this
          reliably because they are already virtualized.

          Run the "VM Smoke Test" workflow on a self-hosted Apple Silicon runner
          before merging changes that affect VM boot, networking, SSH, or guest
          artifacts.
          EOF
